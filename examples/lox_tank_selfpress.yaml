# Tank-only demo: 0.3 m diameter LOX flight tank self-pressurizing on the
# pad (locked-up, ~1 hour hold), plus quasi-static slosh analog parameters.
#
# Run:  cryosim run examples/lox_tank_selfpress.yaml -o output/lox_pad

mode: tank_only
fluid: LOX

tank:
  radius: 0.15            # m
  cyl_length: 0.8         # m
  bottom_dome: elliptical
  top_dome: elliptical
  dome_aspect: 2.0
  wall_mass: 12.0         # kg
  heat_flux: 50.0         # W/m^2 (insulated pad heating estimate)

initial:
  pressure: 200000.0      # Pa (2 bar, saturated)
  fill_fraction: 0.7
  T_liquid: null          # saturated at initial pressure

sim:
  t_end: 3600.0           # s
  accel_g: 1.0
  mdot_out: 0.0
  n_out: 120
  rtol: 0.00001

feed_system:
  pressurization: regulated
  regen_cooled: false
  tanks:
    - {name: LOX, cryogenic: true, oxidizer: true}
